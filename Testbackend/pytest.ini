[pytest]
# Django 测试配置
DJANGO_SETTINGS_MODULE = Testbackend.settings
# 仅收集 apps/ 下的真实单元测试；tests/ 目录与根目录的 test_*.py 均为手动冒烟脚本
# （含 __main__、真实 HTTP 调用、写文件），不应进入 pytest 收集，否则必然失败。
testpaths = apps
python_files = test_*.py
# 过滤 Django 模型类（TestCase/TestModule 等，名为 Test* 但带 __init__）的收集告警
filterwarnings =
    ignore::pytest.PytestCollectionWarning
addopts = -p no:cacheprovider --tb=short -q
